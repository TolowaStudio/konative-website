steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - web/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}
      - --build-arg
      - NEXT_PUBLIC_SANITY_PROJECT_ID=${_SANITY_PROJECT_ID}
      - --build-arg
      - NEXT_PUBLIC_SANITY_DATASET=${_SANITY_DATASET}
      - --build-arg
      - NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=${_POSTHOG_PROJECT_TOKEN}
      - --build-arg
      - NEXT_PUBLIC_POSTHOG_HOST=https://us.i.posthog.com
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
